name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Render smoke test (synthetic frames, no device)
        run: python ci/smoke.py
      - name: Launcher works when symlinked onto PATH (README install step)
        run: |
          mkdir -p "$RUNNER_TEMP/bin dir"
          ln -s "$PWD/revyl-gif" "$RUNNER_TEMP/bin dir/revyl-gif"
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/bin dir:$PATH" revyl-gif --help
